# Builds the application images and pushes them to GHCR. The deploy
# (.forgejo/workflows/staging.yml) only pulls - building happens here, on
# GitHub-hosted runners, which never need the VPN: images touch no OpenStack.
#
# Both images are built on every main push, unconditionally: the deploy
# references one TAG for both, so every main commit must have both images.
# The buildx cache makes unchanged builds cheap.
#
# The images are expected to be PUBLIC packages (the VM pulls without
# credentials) - set the visibility once in the package settings after the
# first push.
name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: llm-model-generator/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: `latest` follows main; `sha-<short>` pins the exact commit for
      # reproducible deploys and rollbacks (set TAG in the deploy .env).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
