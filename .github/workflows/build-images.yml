# Builds the application images and pushes them to GHCR. The deploy
# (.forgejo/workflows/staging.yml) only pulls - building happens here, on
# GitHub-hosted runners, which never need the VPN: images touch no OpenStack.
#
# Both images are built on every main push, unconditionally: the deploy
# references one TAG for both, so every main commit must have both images.
# The buildx cache makes unchanged builds cheap.
#
# The images are expected to be PUBLIC packages (the VM pulls without
# credentials) - set the visibility once in the package settings after the
# first push.
name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Gate: broken commits must not reach GHCR as `latest`. Runs the backend
  # suite against a real Postgres (the tests need JSONB and migrations).
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROJECT_NAME: OntoUI
      ENVIRONMENT: local
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      FIRST_SUPERUSER: ci@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-password
      SECRET_KEY: ci-only-secret
      BACKEND_CORS_ORIGINS: http://localhost:5173
      # Required by Settings but unused in the tests (no Neo4j in CI).
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: ci
      NEO4J_PASSWORD: ci-only-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # The engine shells out to the Pellet reasoner; its jars need a
      # modern JRE (class file 69 = Java 25), so pin one explicitly.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations and seed
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python app/initial_data.py

      # test_onto_models_to_jsonforms.py imports pythonjsonlogger, which is
      # not a declared dependency - broken since before the CI job existed.
      - name: Run backend tests
        working-directory: backend/app
        run: uv run python -m pytest tests/ --ignore=tests/test_onto_models_to_jsonforms.py

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: `latest` follows main; `sha-<short>` pins the exact commit for
      # reproducible deploys and rollbacks (set TAG in the deploy .env).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
